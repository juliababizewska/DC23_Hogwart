<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Candidate Ranking</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #efefef; }
    </style>
</head>
<body>
<h2>Candidate Ranking</h2>
<table>
    <thead>
    <tr><th>Name</th><th>Position</th><th>Score</th><th>Meets Requirements</th><th>CV FIle</th></tr>
    </thead>
    <tbody>
    <tr th:each="c : ${candidates}">
        <td th:text="${c.name}">Name</td>
        <td th:text="${c.position}">Position</td>
        <td th:text="${c.score}">0</td>
        <td th:text="${c.meetsRequirements}">true</td>
        <td th:text="${c.sourceFile}">sourceFile</td>
    </tr>
    </tbody>
</table>
</body>
</html>
