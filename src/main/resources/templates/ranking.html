<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Candidate Ranking</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #efefef; }
        tr.details { background-color: #fafafa; display: none; }
        button { cursor: pointer; padding: 4px 8px; }
        ul { margin: 5px 0 10px 20px; }
    </style>
    <script>
        function toggleDetails(id) {
            const detailsRow = document.getElementById('details-' + id);
            if (detailsRow.style.display === 'table-row') {
                detailsRow.style.display = 'none';
            } else {
                detailsRow.style.display = 'table-row';
            }
        }
    </script>
</head>
<body>

<h2>Candidate Ranking</h2>
<table>
    <thead>
    <tr>
        <th>#</th>
        <th>Imię i Nazwisko</th>
        <th>Stanowisko</th>
        <th>Punktacja</th>
        <th>Wymagania</th>
        <th>Email</th>
        <th>Plik CV</th>
        <th>Szczegóły</th>
    </tr>
    </thead>
    <tbody>
    <th:block th:each="c, stat : ${candidates}">
        <tr>
            <td th:text="${stat.index + 1}"></td>
            <td th:text="${c.full_name}"></td>
            <td th:text="${c.position}"></td>
            <td th:text="${c.score}"></td>
            <td th:text="${c.meetsRequirements}"></td>
            <td th:text="${c.email}"></td>
            <td th:text="${c.sourceFile}"></td>
            <td>
                <button type="button" th:onclick="'toggleDetails(' + ${stat.index} + ')'">Więcej</button>
            </td>
        </tr>

        <tr th:id="'details-' + ${stat.index}" class="details">
            <td colspan="7">
                <h3>Doświadczenie:</h3>
                <div th:each="xp : ${c.experience}">
                    <p><b th:text="${xp.title}"></b> (<span th:text="${xp.period}"></span>)</p>
                    <ul>
                        <li th:each="t : ${xp.tasks}" th:text="${t}"></li>
                    </ul>
                </div>
                <h3>Wykształcenie:</h3>
                <div th:each="edu : ${c.education}">
                    <p><b th:text="${edu.school}"></b> (<span th:text="${edu.period}"></span>)</p>
                    <ul>
                        <li th:each="d : ${edu.description}" th:text="${d}"></li>
                    </ul>
                </div>
                <h3>Umiejętności:</h3>
                <ul>
                    <li th:each="s : ${c.skills}" th:text="${s}"></li>
                </ul>
            </td>
        </tr>
    </th:block>
    </tbody>

</table>

</body>
</html>
